project.export_stage_hint:
  en: "Each stage: its speed on its own and the share of time it spent working, the rest waiting for the others. The slowest one (highlighted) limits the export. Output: frames actually written per second. Startup and finalize: time before the first frame and after the last one, counted in the final total."
  it: "Per ogni fase: la velocità da sola e la quota di tempo passata a lavorare, il resto in attesa delle altre. La più lenta (evidenziata) limita l'export. Uscita: frame scritti davvero al secondo. Avvio e chiusura: tempo prima del primo frame e dopo l'ultimo, conteggiati nel totale finale."

