settings.mcp_enabled:
  en: Let AI agents work in this window (MCP)
  it: Consenti agli agenti AI di lavorare in questa finestra (MCP)
settings.mcp_enabled_hint:
  en: "An MCP client (e.g. Claude Code) connects with the command below. Only your user account can reach it; every change the agent makes can be undone."
  it: "Un client MCP (es. Claude Code) si collega con il comando qui sotto. È raggiungibile solo dal tuo account utente; ogni modifica dell'agente si può annullare."
settings.mcp_forced:
  en: "On for this session: Venturi was started with --mcp."
  it: "Attivo per questa sessione: Venturi è stato avviato con --mcp."
settings.mcp_failed:
  en: "Could not start the MCP server: %{error}"
  it: "Impossibile avviare il server MCP: %{error}"
settings.read_ahead:
  en: Read-ahead
  it: Read-ahead
settings.read_ahead_forward:
  en: "Forward:"
  it: "Avanti:"
settings.read_ahead_forward_hint:
  en: "How many seconds of timeline to buffer ahead of the playhead. More = smoother scrub/playback but more RAM and CPU spent on frames that may never be needed; less = lighter but a short wait during fast scrubbing is more likely. A minimum margin remains even at 0."
  it: "Quanti secondi di timeline bufferizzare in anticipo avanti dalla testina. Di più = scrub/playback più fluidi ma più RAM e CPU spesi su frame che potrebbero non servire mai; di meno = più leggero ma più probabile una breve attesa durante uno scrub veloce. Resta comunque un margine minimo anche a 0."
settings.read_ahead_behind:
  en: "Behind:"
  it: "Indietro:"
settings.read_ahead_behind_hint:
  en: "How many seconds of timeline to keep buffered behind the playhead too, besides the forward window: makes short back-and-forth scrubbing cheap without decoding again every time. A minimum margin remains even at 0."
  it: "Quanti secondi di timeline tenere bufferizzati anche dietro la testina, oltre alla finestra in avanti: rende economico uno scrub avanti-indietro ravvicinato senza dover ridecodificare ogni volta. Resta comunque un margine minimo anche a 0."
settings.video_cache:
  en: "Video cache:"
  it: "Cache video:"
settings.video_cache_hint:
  en: "How much RAM to use for pre-decoded frames: more = smoother scrub/playback, less = lower risk of running out of memory (especially with 4K+ sources)."
  it: "Quanta RAM usare per i frame pre-decodificati: di più = scrub/playback più fluidi, di meno = meno rischio di esaurire la memoria (soprattutto con sorgenti 4K+)."
settings.proxy:
  en: Proxy
  it: Proxy
settings.proxy_quality:
  en: "Proxy quality:"
  it: "Qualità dei proxy:"
settings.proxy_quality_low:
  en: Low
  it: Bassa
settings.proxy_quality_low_hint:
  en: "Smallest and fastest to generate and decode: the smoothest scrubbing even on slow machines, but a visibly soft preview."
  it: "La più leggera da generare e decodificare: scrub più fluido anche su macchine lente, ma anteprima visibilmente sfocata."
settings.proxy_quality_medium:
  en: Medium
  it: Media
settings.proxy_quality_medium_hint:
  en: "Balance between smoothness and sharpness of the preview."
  it: "Equilibrio tra fluidità e nitidezza dell'anteprima."
settings.proxy_quality_high:
  en: High
  it: Alta
settings.proxy_quality_high_hint:
  en: "Up to Full HD with less compression: a sharp preview, but proxies take longer to generate, use more disk and are heavier to decode."
  it: "Fino al Full HD con meno compressione: anteprima nitida, ma i proxy richiedono più tempo per essere generati, occupano più disco e sono più pesanti da decodificare."
settings.proxy_quality_note:
  en: "Changing quality generates new proxies in the background; the ones already generated for other qualities stay on disk."
  it: "Cambiando qualità vengono generati nuovi proxy in background; quelli già generati per altre qualità restano su disco."
settings.hw_decode:
  en: "Hardware decoding"
  it: "Decodifica hardware"
settings.hw_decode_auto:
  en: "Automatic"
  it: "Automatica"
settings.hw_decode_auto_hint:
  en: "Decodes video on the GPU when it can: on a laptop with two GPUs, on the integrated one to save battery. Falls back to the CPU for the files the GPU cannot decode."
  it: "Decodifica i video sulla GPU quando può: su un portatile con due GPU, su quella integrata per risparmiare batteria. Torna alla CPU per i file che la GPU non sa decodificare."
settings.hw_decode_auto_cpu:
  en: "no GPU decoder found, CPU"
  it: "nessun decoder GPU trovato, CPU"
settings.hw_decode_off:
  en: "Off (CPU only)"
  it: "Disattivata (solo CPU)"
settings.hw_decode_nvdec:
  en: "NVIDIA (NVDEC)"
  it: "NVIDIA (NVDEC)"
settings.hw_decode_vulkan:
  en: "Vulkan video"
  it: "Vulkan video"
settings.hw_decode_vulkan_hint:
  en: "Any GPU whose driver supports Vulkan video decoding (Intel, AMD, NVIDIA): on a laptop with two GPUs, the discrete one."
  it: "Qualsiasi GPU il cui driver supporti la decodifica Vulkan video (Intel, AMD, NVIDIA): su un portatile con due GPU, quella dedicata."
settings.hw_decode_failed:
  en: "⚠ %{devices} cannot decode video on this machine: decoding on the CPU."
  it: "⚠ %{devices} non può decodificare video su questa macchina: si decodifica sulla CPU."
settings.hw_decode_intel_experimental:
  en: "Experimental Intel Vulkan decoding (restart required)"
  it: "Decodifica Vulkan Intel sperimentale (richiede riavvio)"
settings.hw_decode_intel_experimental_hint:
  en: "On Intel GPUs from Gen9 to Gen11 (Skylake to Ice Lake), Mesa offers Vulkan video decoding only as an experimental feature (ANV_DEBUG=video-decode). It can be faster and frees the CPU, but the driver may decode some files wrongly. Newer Intel GPUs do not need it."
  it: "Sulle GPU Intel dalla Gen9 alla Gen11 (da Skylake a Ice Lake), Mesa offre la decodifica Vulkan video solo come funzione sperimentale (ANV_DEBUG=video-decode). Può essere più veloce e libera la CPU, ma il driver potrebbe decodificare male alcuni file. Le GPU Intel più recenti non ne hanno bisogno."
settings.hw_decode_memory:
  en: "GPU decoding memory:"
  it: "Memoria decodifica GPU:"
settings.hw_decode_memory_hint:
  en: "Memory the GPU decoders may hold together; past it, new ones decode on the CPU. On Apple Silicon it is the same memory as the rest of the system. Default: an eighth of the RAM."
  it: "Memoria che i decoder GPU possono occupare insieme; oltre, i nuovi decodificano sulla CPU. Su Apple Silicon è la stessa memoria del resto del sistema. Predefinita: un ottavo della RAM."
settings.hw_decode_memory_reset:
  en: "Default"
  it: "Predefinita"
