mixer.normalize_hint_independent:
  en: "Each clip of the track gets its own gain: all of them reach the target."
  it: "Ogni clip della traccia ha il suo guadagno: arrivano tutte al livello obiettivo."

mixer.normalize_hint_relative:
  en: "One gain for the whole track: the loudest clip reaches the target, the differences between the clips stay."
  it: "Un unico guadagno per tutta la traccia: la clip più forte arriva al livello obiettivo, le differenze tra le clip restano."

mixer.normalize_hint_master:
  en: "Brings the level of the whole mix to the target."
  it: "Porta il livello dell'intero mix al livello obiettivo."

mixer.normalize_hint_loudness:
  en: "Measured as the ear perceives it, not on the peaks: a high gain can clip the peaks."
  it: "Misurata come la percepisce l'orecchio, non sui picchi: un guadagno alto può far clippare i picchi."

mixer.normalize_failed:
  en: "The level cannot be measured: it plays without normalization; retrying.\n%{error}"
  it: "Impossibile misurare il livello: suona senza normalizzazione; nuovo tentativo in corso.\n%{error}"

