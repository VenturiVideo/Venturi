[package]
name = "vv-app"
version.workspace = true
edition.workspace = true

[lints]
workspace = true

[dependencies]
arboard = { version = "3.6.1", default-features = false, features = ["image-data"] }
eframe = { version = "0.36.2", default-features = false, features = ["wgpu", "default_fonts", "links", "persistence", "wayland", "x11"] }
egui = "0.36.2"
env_logger = "0.11.11"
libc = "0.2"
png = "0.18"
rfd = "0.17.2"
rust-i18n = "4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sys-locale = "0.3"
vv-audio = { path = "../vv-audio" }
vv-core = { path = "../vv-core" }
vv-media = { path = "../vv-media" }
vv-render = { path = "../vv-render" }
vv-mcp = { path = "../vv-mcp" }
vv-session = { path = "../vv-session" }


[target.'cfg(target_os = "linux")'.dependencies]
# Direct dependency only for the feature: without it, winit's client-side
# decorations draw the buttons but not the window title.
winit = { version = "0.30.13", features = ["wayland-csd-adwaita"] }
raw-window-handle = "0.6.2"
sctk = { package = "smithay-client-toolkit", version = "0.20.0", default-features = false }
wayland-backend = { version = "0.3.17", features = ["client_system"] }

[dev-dependencies]
tokio = { version = "1", features = ["sync"] }
