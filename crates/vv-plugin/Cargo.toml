[package]
name = "vv-plugin"
version.workspace = true
edition.workspace = true

[lints]
workspace = true

[features]
testing = []

[dependencies]
libloading = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
vst3 = "0.3"
vv-audio = { path = "../vv-audio" }
vv-core = { path = "../vv-core" }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-foundation = "0.3"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSGraphics", "NSResponder", "NSView", "NSWindow"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSGeometry", "NSString", "NSNotification", "NSObject"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = "0.13"
