[workspace]
resolver = "2"
members = [
    "crates/vv-core",
    "crates/vv-media",
    "crates/vv-render",
    "crates/vv-audio",
    "crates/vv-session",
    "crates/vv-vad",
    "crates/vv-mcp",
    "crates/vv-app",
]

[workspace.package]
edition = "2024"
version = "0.6.0"
license = "GPL-3.0-or-later"

[workspace.lints.clippy]
# Wide UI/compositor signatures and step-by-step Default setups are
# deliberate here; the rest of clippy is enforced by CI.
too_many_arguments = "allow"
field_reassign_with_default = "allow"

[profile.dev]
opt-level = 1
# Backtraces keep file and line; full debuginfo made every link slow.
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
