name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  check:
    runs-on: ubuntu-24.04
    # Same distro and packages as container/Containerfile: Fedora's FFmpeg
    # (RPM Fusion) is the one the project is developed against.
    container: fedora:44
    steps:
      - name: Install dependencies
        run: |
          dnf install -y \
            https://download1.rpmfusion.org/free/fedora/rpmfusion-free-release-44.noarch.rpm
          dnf install -y \
            rust cargo clippy rustfmt git \
            ffmpeg ffmpeg-devel \
            clang clang-devel \
            wayland-devel libxkbcommon-devel libxkbcommon-x11 libX11-devel \
            vulkan-loader-devel mesa-vulkan-drivers \
            alsa-lib-devel
          # No sound card on the runner: a null device keeps cpal happy.
          printf 'pcm.!default {\n  type null\n}\nctl.!default {\n  type null\n}\n' \
            > /etc/asound.conf

      - uses: actions/checkout@v7

      # Its own key ignores [profile] and [env], and an exact hit never saves
      # again: after a profile change every run would rebuild from scratch.
      # The version line is left out, or every release would miss the cache.
      - name: Cache key
        id: cache-key
        run: echo "hash=$(grep -v '^version = ' Cargo.toml | cat - .cargo/config.toml | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ steps.cache-key.outputs.hash }}
          cache-on-failure: true

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Check (performance feature)
        run: cargo check --locked --all-targets --features performance

      # Single-threaded via .cargo/config.toml; the GPU tests run on
      # lavapipe (software Vulkan, part of mesa-vulkan-drivers).
      # The skipped tests measure real-time audio pacing: ALSA's null PCM
      # never blocks, so the audio clock runs far ahead of wall time there.
      - name: Test
        run: |
          cargo test --workspace -- \
            --skip timeline_audio::tests:: \
            --skip fast_playback_ \
            --skip preview_mix_follows_audio_clip_edits \
            --skip space_plays_the_media_pool_preview

  # The macOS loader, the native editor and the fixture bundle: the Linux job
  # covers the rest of the workspace.
  vv-plugin-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: brew install ffmpeg pkgconf

      - name: Test
        run: cargo test -p vv-plugin
